name: Fetch Tomorrow's Odds

# Fires at 2am ET (after the latest west coast MLB game ends ~1am ET, when
# books have posted tomorrow's opening lines). This pre-populates the
# persisted odds store so the dashboard has data for tomorrow's slate
# before the 11am ET refresh runs.
#
# Note: cron times are UTC. 2am ET == 6am UTC during EDT (March–Nov) and
# 7am UTC during EST (Nov–March). The existing workflow's morning/evening
# crons assume EDT; matching that convention here. Both will drift by 1hr
# during EST — acceptable for this use case.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  fetch-tomorrow-odds:
    runs-on: ubuntu-latest
    environment: production
    env:
      API_URL: ${{ secrets.API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Wake up Render and fetch tomorrow's NBA odds
        run: |
          echo "Waking up server..."
          
          for attempt in {1..6}; do
            if curl --fail --silent --show-error --max-time 20 \
              "$API_URL/health" >/dev/null; then
              echo "Server is ready"
              break
            fi

            if [ "$attempt" -eq 6 ]; then
              echo "Server did not become ready" >&2
              exit 1
            fi

            echo "Server unavailable, retrying in 15 seconds..."
            sleep 15
          done

          echo "Fetching tomorrow's NBA odds..."
          if response=$(curl \
            --retry 4 \
            --retry-delay 15 \
            --retry-max-time 180 \
            --silent \
            --show-error \
            --fail \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$API_URL/api/nba/cron/fetch-odds?offset=1"); then
            printf 'Response: %s\n' "$response"
          else
            curl_status=$?
            printf 'Request failed:\n%s\n' "$response" >&2
            exit "$curl_status"
          fi

          # Still required: collector failures come back as HTTP 200.
          if ! jq -e '.success == true' >/dev/null <<<"$response"; then
            printf "Failed to fetch tomorrow's NBA odds:\n%s\n" "$response" >&2
            exit 1
          fi

          fresh=$(jq -r '.fresh_from_api // 0' <<<"$response")
          echo "Tomorrow NBA odds fetched: fresh=${fresh}"
          # fresh=0 is acceptable here — tomorrow may be a dark day, or
          # lines may not yet be posted. Don't fail the job.

      - name: Fetch tomorrow's MLB odds
        run: |
          echo "Fetching tomorrow's MLB odds..."
          if response=$(curl \
            --retry 4 \
            --retry-delay 15 \
            --retry-max-time 180 \
            --silent \
            --show-error \
            --fail \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$API_URL/api/mlb/cron/fetch-odds?offset=1&collection_key=${{ github.run_id }}-tomorrow"); then
            printf 'Response: %s\n' "$response"
          else
            curl_status=$?
            printf 'Request failed:\n%s\n' "$response" >&2
            exit "$curl_status"
          fi

          if ! jq -e '.success == true' >/dev/null <<<"$response"; then
            printf "Failed to fetch tomorrow's MLB odds:\n%s\n" "$response" >&2
            exit 1
          fi

          fresh=$(jq -r '.fresh_from_api // 0' <<<"$response")
          echo "Tomorrow MLB odds fetched: fresh=${fresh}"
          # fresh=0 is acceptable — off-day or lines not yet posted.

          if jq -e '.pitcher_k_skipped == true' >/dev/null <<<"$response"; then
            echo "WARNING: Tomorrow's MLB pitcher-K markets were rejected; game odds fallback succeeded"
          elif ! jq -e '.pitcher_k_success == true' >/dev/null <<<"$response"; then
            printf "Failed to collect tomorrow's MLB pitcher-K odds:\n%s\n" "$response" >&2
            exit 1
          fi

      - name: Fetch tomorrow's NHL odds
        run: |
          echo "Fetching tomorrow's NHL odds..."
          if response=$(curl \
            --retry 4 \
            --retry-delay 15 \
            --retry-max-time 180 \
            --silent \
            --show-error \
            --fail \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$API_URL/api/nhl/cron/fetch-odds?offset=1"); then
            printf 'Response: %s\n' "$response"
          else
            curl_status=$?
            printf 'Request failed:\n%s\n' "$response" >&2
            exit "$curl_status"
          fi

          if ! jq -e '.success == true' >/dev/null <<<"$response"; then
            printf "Failed to fetch tomorrow's NHL odds:\n%s\n" "$response" >&2
            exit 1
          fi

          fresh=$(jq -r '.fresh_from_api // 0' <<<"$response")
          echo "Tomorrow NHL odds fetched: fresh=${fresh}"
          # fresh=0 is acceptable — off-day or lines not yet posted.

      - name: Fetch tomorrow's WNBA odds
        run: |
          echo "Fetching tomorrow's WNBA odds..."
          if response=$(curl \
            --retry 4 \
            --retry-delay 15 \
            --retry-max-time 180 \
            --silent \
            --show-error \
            --fail \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$API_URL/api/wnba/cron/fetch-odds?offset=1"); then
            printf 'Response: %s\n' "$response"
          else
            curl_status=$?
            printf 'Request failed:\n%s\n' "$response" >&2
            exit "$curl_status"
          fi

          if ! jq -e '.success == true' >/dev/null <<<"$response"; then
            printf "Failed to fetch tomorrow's WNBA odds:\n%s\n" "$response" >&2
            exit 1
          fi

          fresh=$(jq -r '.fresh_from_api // 0' <<<"$response")
          echo "Tomorrow WNBA odds fetched: fresh=${fresh}"
          # fresh=0 is acceptable — off-day or lines not yet posted.

      - name: Fetch upcoming NFL odds
        run: |
          echo "Fetching upcoming NFL odds..."
          if response=$(curl \
            --retry 4 \
            --retry-delay 15 \
            --retry-max-time 180 \
            --silent \
            --show-error \
            --fail \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$API_URL/api/nfl/cron/fetch-odds?lookahead_days=7"); then
            printf 'Response: %s\n' "$response"
          else
            curl_status=$?
            printf 'Request failed:\n%s\n' "$response" >&2
            exit "$curl_status"
          fi

          if ! jq -e '.success == true' >/dev/null <<<"$response"; then
            printf "Failed to fetch upcoming NFL odds:\n%s\n" "$response" >&2
            exit 1
          fi

          fresh=$(jq -r '.fresh_from_api // 0' <<<"$response")
          echo "Upcoming NFL odds fetched: fresh=${fresh}"
