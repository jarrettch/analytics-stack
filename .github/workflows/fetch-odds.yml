name: Fetch Daily Odds

on:
  schedule:
    # 11am ET (16:00 UTC) - morning lines
    - cron: '0 16 * * *'
    # 5pm ET (22:00 UTC) - closing lines, ~1hr before most evening tips
    - cron: '0 22 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Wake up Render and fetch odds
        run: |
          # First request wakes the server (may timeout on cold start)
          echo "Waking up server..."
          curl -s --max-time 120 "${{ secrets.API_URL }}/api/nba/today" || true

          # Wait for server to fully warm up
          sleep 30

          # Fetch and persist odds
          echo "Fetching odds..."
          response=$(curl -s --max-time 120 "${{ secrets.API_URL }}/api/nba/cron/fetch-odds")
          echo "Response: $response"

          # Check for success and non-zero fresh odds
          if echo "$response" | grep -q 'success.*true'; then
            fresh=$(echo "$response" | grep -o '"fresh_from_api":[0-9]*' | grep -o '[0-9]*' || echo "0")
            persisted=$(echo "$response" | grep -o '"persisted_loaded":[0-9]*' | grep -o '[0-9]*' || echo "0")
            echo "Odds fetched: fresh=${fresh} persisted=${persisted}"
            if [ "$fresh" = "0" ]; then
              echo "WARNING: No fresh odds from API — check Odds API quota or errors"
              exit 1
            fi
          else
            echo "Failed to fetch odds"
            echo "Full response: $response"
            exit 1
          fi

      - name: Fetch MLB odds
        run: |
          echo "Fetching MLB odds..."
          response=$(curl -s --max-time 120 "${{ secrets.API_URL }}/api/mlb/cron/fetch-odds")
          echo "Response: $response"

          if echo "$response" | grep -q 'success.*true'; then
            fresh=$(echo "$response" | grep -o '"fresh_from_api":[0-9]*' | grep -o '[0-9]*' || echo "0")
            persisted=$(echo "$response" | grep -o '"persisted_loaded":[0-9]*' | grep -o '[0-9]*' || echo "0")
            echo "MLB odds fetched: fresh=${fresh} persisted=${persisted}"
            if [ "$fresh" = "0" ]; then
              echo "WARNING: No fresh MLB odds from API — may be off-season or API issue"
              exit 1
            fi
          else
            echo "Failed to fetch MLB odds"
            echo "Full response: $response"
            exit 1
          fi
