name: Fetch Daily Odds

on:
  schedule:
    # Noon ET during daylight time (16:00 UTC) - morning / early-window close
    - cron: '0 16 * * *'
    # 6pm ET during daylight time (22:00 UTC) - evening lines
    - cron: '0 22 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  fetch-odds:
    runs-on: ubuntu-latest
    environment: production
    env:
      API_URL: ${{ secrets.API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Wake up Render and fetch odds
        run: |
          # First request wakes the server (may timeout on cold start)
          echo "Waking up server..."
          curl -s --max-time 120 "$API_URL/api/nba/today" || true

          # Wait for server to fully warm up
          sleep 30

          # Fetch and persist odds
          echo "Fetching odds..."
          if response=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$API_URL/api/nba/cron/fetch-odds"); then
            printf 'Response: %s\n' "$response"
          else
            curl_status=$?
            printf 'Request failed:\n%s\n' "$response" >&2
            exit "$curl_status"
          fi

          # Still required: collector failures come back as HTTP 200.
          if ! jq -e '.success == true' >/dev/null <<<"$response"; then
            printf 'Failed to fetch odds:\n%s\n' "$response" >&2
            exit 1
          fi

          fresh=$(jq -r '.fresh_from_api // 0' <<<"$response")
          persisted=$(jq -r '.persisted_loaded // 0' <<<"$response")
          echo "Odds fetched: fresh=${fresh} persisted=${persisted}"
          if [ "$fresh" -eq 0 ]; then
            echo "WARNING: No fresh odds from API — dark day or lines not yet posted"
          fi

      - name: Fetch MLB odds
        run: |
          echo "Fetching MLB odds..."
          if response=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$API_URL/api/mlb/cron/fetch-odds?collection_key=${{ github.run_id }}-today"); then
            printf 'Response: %s\n' "$response"
          else
            curl_status=$?
            printf 'Request failed:\n%s\n' "$response" >&2
            exit "$curl_status"
          fi

          if ! jq -e '.success == true' >/dev/null <<<"$response"; then
            printf 'Failed to fetch MLB odds:\n%s\n' "$response" >&2
            exit 1
          fi

          fresh=$(jq -r '.fresh_from_api // 0' <<<"$response")
          persisted=$(jq -r '.persisted_loaded // 0' <<<"$response")
          pitcher_k_outcomes=$(jq -r '.pitcher_k_outcomes_found // 0' <<<"$response")
          echo "MLB odds fetched: fresh=${fresh} persisted=${persisted}"
          if [ "$fresh" -eq 0 ]; then
            echo "WARNING: No fresh MLB odds from API — dark day or lines not yet posted"
          fi

          if jq -e '.pitcher_k_skipped == true' >/dev/null <<<"$response"; then
            echo "WARNING: MLB pitcher-K markets were rejected; game odds fallback succeeded"
          elif ! jq -e '.pitcher_k_success == true' >/dev/null <<<"$response"; then
            printf 'Failed to collect MLB pitcher-K odds:\n%s\n' "$response" >&2
            exit 1
          elif [ "$fresh" -ne 0 ] && [ "$pitcher_k_outcomes" -eq 0 ]; then
            echo "WARNING: MLB slate returned games but no pitcher-K outcomes"
          fi

      - name: Fetch NHL odds
        run: |
          echo "Fetching NHL odds..."
          if response=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$API_URL/api/nhl/cron/fetch-odds"); then
            printf 'Response: %s\n' "$response"
          else
            curl_status=$?
            printf 'Request failed:\n%s\n' "$response" >&2
            exit "$curl_status"
          fi

          if ! jq -e '.success == true' >/dev/null <<<"$response"; then
            printf 'Failed to fetch NHL odds:\n%s\n' "$response" >&2
            exit 1
          fi

          fresh=$(jq -r '.fresh_from_api // 0' <<<"$response")
          persisted=$(jq -r '.persisted_loaded // 0' <<<"$response")
          echo "NHL odds fetched: fresh=${fresh} persisted=${persisted}"
          if [ "$fresh" -eq 0 ]; then
            echo "WARNING: No fresh NHL odds from API — dark day or lines not yet posted"
          fi

      - name: Fetch WNBA odds
        run: |
          echo "Fetching WNBA odds..."
          if response=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$API_URL/api/wnba/cron/fetch-odds"); then
            printf 'Response: %s\n' "$response"
          else
            curl_status=$?
            printf 'Request failed:\n%s\n' "$response" >&2
            exit "$curl_status"
          fi

          if ! jq -e '.success == true' >/dev/null <<<"$response"; then
            printf 'Failed to fetch WNBA odds:\n%s\n' "$response" >&2
            exit 1
          fi

          fresh=$(jq -r '.fresh_from_api // 0' <<<"$response")
          persisted=$(jq -r '.persisted_loaded // 0' <<<"$response")
          echo "WNBA odds fetched: fresh=${fresh} persisted=${persisted}"
          if [ "$fresh" -eq 0 ]; then
            echo "WARNING: No fresh WNBA odds from API — dark day or lines not yet posted"
          fi

      - name: Fetch NFL odds
        run: |
          echo "Fetching NFL odds..."
          if response=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$API_URL/api/nfl/cron/fetch-odds"); then
            printf 'Response: %s\n' "$response"
          else
            curl_status=$?
            printf 'Request failed:\n%s\n' "$response" >&2
            exit "$curl_status"
          fi

          if ! jq -e '.success == true' >/dev/null <<<"$response"; then
            printf 'Failed to fetch NFL odds:\n%s\n' "$response" >&2
            exit 1
          fi

          fresh=$(jq -r '.fresh_from_api // 0' <<<"$response")
          persisted=$(jq -r '.persisted_loaded // 0' <<<"$response")
          echo "NFL odds fetched: fresh=${fresh} persisted=${persisted}"
          if [ "$fresh" -eq 0 ]; then
            echo "WARNING: No fresh NFL odds — dark day or lines not yet posted"
          fi
