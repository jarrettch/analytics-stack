name: Fetch NFL Early-Window Odds

on:
  schedule:
    # Native timezone scheduling follows EDT/EST and remains valid if the
    # GitHub-hosted runner starts after the nominal trigger time.
    - cron: '30 12 * * 0'
      timezone: 'America/New_York'
  workflow_dispatch:

jobs:
  fetch-nfl-close-odds:
    runs-on: ubuntu-latest
    environment: production
    env:
      API_URL: ${{ secrets.API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Fetch NFL early-window odds
        run: |
          echo "Waking up server..."
          curl -s --max-time 120 "$API_URL/api/nfl/today" || true
          sleep 30

          echo "Fetching NFL early-window odds..."
          if response=$(curl \
            --silent \
            --show-error \
            --fail-with-body \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$API_URL/api/nfl/cron/fetch-odds?verify_early_window=true"); then
            printf 'Response: %s\n' "$response"
          else
            curl_status=$?
            printf 'Request failed:\n%s\n' "$response" >&2
            exit "$curl_status"
          fi

          # Still required: collector failures come back as HTTP 200.
          if ! jq -e '.success == true' >/dev/null <<<"$response"; then
            printf 'Failed to fetch NFL early-window odds:\n%s\n' "$response" >&2
            exit 1
          fi

          fresh=$(jq -r '.fresh_from_api // 0' <<<"$response")
          scoreboard_ok=$(jq -r '.early_window_scoreboard_ok // false' <<<"$response")
          expected=$(jq -r '.early_window_games // 0' <<<"$response")
          candidates=$(jq -r '.early_window_snapshot_candidates // 0' <<<"$response")
          inserted=$(jq -r '.snapshots_inserted // 0' <<<"$response")
          deduplicated=$(jq -r '.snapshots_deduplicated // 0' <<<"$response")
          persistence_ok=$(jq -r '.snapshot_persistence_ok // false' <<<"$response")

          echo "NFL early-window odds: fresh=${fresh} expected=${expected} candidates=${candidates} inserted=${inserted} deduplicated=${deduplicated}"

          if [ "$scoreboard_ok" != "true" ]; then
            echo "Could not verify the NFL early window because the ESPN scoreboard was unavailable"
            exit 1
          fi

          if [ "$expected" -eq 0 ]; then
            echo "No 1pm-window NFL games are scheduled today"
          fi

          if [ "$expected" -gt 0 ] && [ "$persistence_ok" != "true" ]; then
            echo "NFL odds history persistence failed for a scheduled early window"
            exit 1
          fi

          if [ "$candidates" -lt "$expected" ]; then
            echo "Only ${candidates} of ${expected} scheduled early-window games produced pregame snapshot candidates"
            exit 1
          fi
