name: Fetch Player Props

# NFL and NBA props in one run per pg_cron tick (:07/:37, 08:07-22:37 ET),
# so NBA adds collection time but almost no extra gate-only runs, and the two
# leagues never compete for the concurrency group. The runner gate checks
# each league's window in parallel; the driver collects eligible leagues
# earliest guard deadline first. Empty windows never wake Render.
# Design and Actions-minutes budget: apps/api/specs/nba_player_props.md
#
# Scheduled by Supabase pg_cron, since GitHub's schedule ran hours late.
# The NBA phase (11:37 and 15:37 ET are intraday) comes from this run's
# created_at, so a queued or rerun dispatch keeps its tick's phase.
on:
  workflow_dispatch:

# Future SharpAPI workflows must use this same group because the API key is shared.
concurrency:
  group: sharpapi-odds
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  fetch-player-props:
    runs-on: ubuntu-latest
    # Gate 3 + warm-up ~3.5 + driver 18 (two leagues x 9 min) = 24.5 worst case.
    timeout-minutes: 30
    environment: production
    env:
      API_URL: ${{ secrets.API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v7

      - name: Check NFL and NBA windows on runner
        id: gate
        timeout-minutes: 3
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/props_schedule_gate.py

      - name: Wake Render
        id: wake
        if: steps.gate.outputs.nfl_eligible == 'true' || steps.gate.outputs.nba_eligible == 'true'
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..6}; do
            echo "Render warm-up attempt ${attempt}/6. Collection has not started; each health check allows 20 seconds."
            if curl --fail --silent --show-error --max-time 20 "$API_URL/health" >/dev/null; then
              echo "Render is ready."
              exit 0
            fi
            if [ "$attempt" -eq 6 ]; then
              echo "::error::Render did not become ready after six attempts; no collection was requested."
              exit 1
            fi
            echo "Warm-up check failed or timed out; retrying in 15 seconds."
            sleep 15
          done

      # Runs even when nothing is eligible, so a league whose gate lookup
      # failed still fails the job. Collection requests are never retried.
      # -u: unbuffered, so each log line is timestamped when it's printed.
      - name: Collect props
        if: steps.gate.outcome == 'success' && steps.wake.outcome != 'failure'
        timeout-minutes: 20
        env:
          WINDOW_AT: ${{ steps.gate.outputs.window_at }}
          NBA_PHASE: ${{ steps.gate.outputs.nba_phase }}
          NFL_GATE_OK: ${{ steps.gate.outputs.nfl_gate_ok }}
          NFL_ELIGIBLE: ${{ steps.gate.outputs.nfl_eligible }}
          NFL_DEADLINE: ${{ steps.gate.outputs.nfl_deadline }}
          NBA_GATE_OK: ${{ steps.gate.outputs.nba_gate_ok }}
          NBA_ELIGIBLE: ${{ steps.gate.outputs.nba_eligible }}
          NBA_DEADLINE: ${{ steps.gate.outputs.nba_deadline }}
        run: python3 -u scripts/run_props_collection.py
