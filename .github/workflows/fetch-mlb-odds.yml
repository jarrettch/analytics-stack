name: Fetch MLB Intraday Odds

on:
  schedule:
    # Extra MLB-only poll at 3pm ET during daylight time.
    - cron: "0 19 * * *"
  workflow_dispatch:

jobs:
  fetch-mlb-odds:
    runs-on: ubuntu-latest
    environment: production
    env:
      API_URL: ${{ secrets.API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Wake up Render
        run: |
          echo "Waking up server..."
          for attempt in {1..6}; do
            if curl --fail --silent --show-error --max-time 20 \
              "$API_URL/health" >/dev/null; then
              echo "Server is ready"
              break
            fi

            if [ "$attempt" -eq 6 ]; then
              echo "Server did not become ready" >&2
              exit 1
            fi

            echo "Server unavailable, retrying in 15 seconds..."
            sleep 15
          done

      - name: Fetch MLB game and pitcher-K odds
        run: |
          echo "Fetching MLB odds..."
          if response=$(curl \
            --retry 4 \
            --retry-delay 15 \
            --retry-max-time 180 \
            --silent \
            --show-error \
            --fail \
            --max-time 120 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$API_URL/api/mlb/cron/fetch-odds?collection_key=${{ github.run_id }}-today"); then
            printf 'Response: %s\n' "$response"
          else
            curl_status=$?
            printf 'Request failed:\n%s\n' "$response" >&2
            exit "$curl_status"
          fi

          if ! jq -e '.success == true' >/dev/null <<<"$response"; then
            printf 'Failed to fetch MLB odds:\n%s\n' "$response" >&2
            exit 1
          fi

          fresh=$(jq -r '.fresh_from_api // 0' <<<"$response")
          persisted=$(jq -r '.persisted_loaded // 0' <<<"$response")
          pitcher_k_outcomes=$(jq -r '.pitcher_k_outcomes_found // 0' <<<"$response")
          echo "MLB odds fetched: fresh=${fresh} persisted=${persisted}"
          if [ "$fresh" -eq 0 ]; then
            echo "No pregame MLB events remain in the current request window."
          fi

          if jq -e '.pitcher_k_skipped == true' >/dev/null <<<"$response"; then
            echo "WARNING: MLB pitcher-K markets were rejected; game odds fallback succeeded"
          elif ! jq -e '.pitcher_k_success == true' >/dev/null <<<"$response"; then
            printf 'Failed to collect MLB pitcher-K odds:\n%s\n' "$response" >&2
            exit 1
          elif ! jq -e '.pitcher_k_identity_success == true' >/dev/null <<<"$response"; then
            printf 'Failed to persist MLB pitcher-K identity mappings:\n%s\n' "$response" >&2
            exit 1
          elif [ "$fresh" -ne 0 ] && [ "$pitcher_k_outcomes" -eq 0 ]; then
            echo "WARNING: MLB slate returned games but no pitcher-K outcomes"
          fi
