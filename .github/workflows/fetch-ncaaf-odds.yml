name: Fetch College Odds

# NCAAF and NCAAB odds come from ESPN at zero SGO cost, so this stays out of
# fetch-odds.yml, which is the SGO entity-budget surface.
#
# ESPN drops odds at tipoff/kickoff. Collect NCAAB today and tomorrow to
# also capture posted lines for pre-10am ET tips. Each collection is attempted
# even when wake-up or an earlier collection fails. Keep this filename for pg_cron.
#
# Scheduled by Supabase pg_cron, since GitHub's schedule ran hours late:
# supabase/migrations/20261023000000_schedule_collectors_with_pg_cron.sql
on:
  workflow_dispatch:

jobs:
  fetch-ncaaf-odds:
    runs-on: ubuntu-latest
    environment: production
    env:
      API_URL: ${{ secrets.API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Wake Render
        run: |
          echo "Waking up server..."

          for attempt in {1..6}; do
            if curl --fail --silent --show-error --max-time 20 \
              "$API_URL/health" >/dev/null; then
              echo "Server is ready"
              break
            fi

            if [ "$attempt" -eq 6 ]; then
              echo "Server did not become ready" >&2
              exit 1
            fi

            echo "Server unavailable, retrying in 15 seconds..."
            sleep 15
          done

      - name: Fetch NCAAF odds (today)
        if: ${{ !cancelled() }}
        run: scripts/collect_espn_odds.sh ncaaf 0

      - name: Fetch NCAAB odds (today)
        if: ${{ !cancelled() }}
        run: scripts/collect_espn_odds.sh ncaab 0

      - name: Fetch NCAAB odds (tomorrow)
        if: ${{ !cancelled() }}
        run: scripts/collect_espn_odds.sh ncaab 1
