name: Fetch UFC Odds

# UFC odds come from SharpAPI (no monthly cap), so this stays out of
# fetch-odds.yml, which is the SGO entity-budget surface.
#
# Daily, because the target is the next card rather than today's: each run
# adds a point to the week-long line-movement path before a card.
#
# SharpAPI requests share one process-wide pacing lock and one API key with
# NFL props. The concurrency group serializes manual, retried, and delayed
# runs; the :20 schedule just keeps the usual case clear of props at :07/:37.
# A sweep takes at least 15 seconds by design.
#
# Scheduled by Supabase pg_cron, since GitHub's schedule ran hours late:
# supabase/migrations/20261023000000_schedule_collectors_with_pg_cron.sql
on:
  workflow_dispatch:

concurrency:
  group: sharpapi-odds
  cancel-in-progress: false

jobs:
  fetch-ufc-odds:
    runs-on: ubuntu-latest
    environment: production
    env:
      API_URL: ${{ secrets.API_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Fetch UFC odds
        run: |
          echo "Waking up server..."

          for attempt in {1..6}; do
            if curl --fail --silent --show-error --max-time 20 \
              "$API_URL/health" >/dev/null; then
              echo "Server is ready"
              break
            fi

            if [ "$attempt" -eq 6 ]; then
              echo "Server did not become ready" >&2
              exit 1
            fi

            echo "Server unavailable, retrying in 15 seconds..."
            sleep 15
          done

          echo "Fetching UFC odds..."
          if response=$(curl \
            --retry 4 \
            --retry-delay 15 \
            --retry-max-time 240 \
            --silent \
            --show-error \
            --fail \
            --max-time 180 \
            --request POST \
            --header "Authorization: Bearer ${CRON_SECRET}" \
            "$API_URL/api/ufc/cron/fetch-odds"); then
            printf 'Response: %s\n' "$response"
          else
            curl_status=$?
            printf 'Request failed:\n%s\n' "$response" >&2
            exit "$curl_status"
          fi

          # Still required: collector failures come back as HTTP 200.
          if ! jq -e '.success == true' >/dev/null <<<"$response"; then
            printf 'Failed to fetch UFC odds:\n%s\n' "$response" >&2
            exit 1
          fi

          card=$(jq -r '.card.name // "none"' <<<"$response")
          written=$(jq -r '.fights_written // 0' <<<"$response")
          unmatched=$(jq -r '.unmatched // 0' <<<"$response")
          ambiguous=$(jq -r '.ambiguous // 0' <<<"$response")
          candidates=$(jq -r '.pregame_snapshot_candidates // 0' <<<"$response")
          persistence_ok=$(jq -r '.snapshot_persistence_ok // false' <<<"$response")

          echo "UFC odds: card=${card} written=${written} unmatched=${unmatched} ambiguous=${ambiguous} snapshots=${candidates}"

          if [ "$candidates" -gt 0 ] && [ "$persistence_ok" != "true" ]; then
            echo "UFC odds history persistence failed" >&2
            exit 1
          fi
